<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Roli · A jugar</title>
<meta name="theme-color" content="#0f1216">
<style>
  :root { --rr-a: #ffd23f; --rr-b: #3ddc97; --rr-c: #4cc9f0; --rr-d: #ff6b9d; }
  html, body { background: #0f1216; }
  body { margin: 0; color: #f3f5f7; font-family: "Source Sans 3", system-ui, sans-serif; overflow-x: hidden; }
  /* Las fotos de Roli, de fondo, desvanecidas y con un movimiento lento. */
  .fondo { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .fondo i { position: absolute; background-size: cover; background-position: center; opacity: 0; will-change: transform, opacity; }
  .fondo .f1 { inset: -6% -4% -6% 28%; background-image: url(roli-foto-frente.jpg);
    -webkit-mask-image: linear-gradient(to left, #000 25%, transparent 92%); mask-image: linear-gradient(to left, #000 25%, transparent 92%);
    animation: ver1 28s ease-in-out infinite; }
  .fondo .f2 { inset: -4% 30% -4% -6%; background-image: url(roli-foto-arriba.jpg);
    -webkit-mask-image: linear-gradient(to right, #000 20%, transparent 90%); mask-image: linear-gradient(to right, #000 20%, transparent 90%);
    animation: ver2 28s ease-in-out infinite; }
  @keyframes ver1 { 0% { opacity: 0; transform: scale(1.04) translateX(1%); } 8% { opacity: .30; } 42% { opacity: .30; transform: scale(1.12) translateX(-1%); } 50%, 100% { opacity: 0; transform: scale(1.12); } }
  @keyframes ver2 { 0%, 50% { opacity: 0; transform: scale(1.04); } 58% { opacity: .30; } 92% { opacity: .30; transform: scale(1.12) translateX(1%); } 100% { opacity: 0; transform: scale(1.12); } }
  .fondo::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(60% 50% at 12% 0%, rgba(76,201,240,.22), transparent 70%), radial-gradient(50% 45% at 100% 100%, rgba(255,107,157,.18), transparent 70%), radial-gradient(40% 40% at 90% 10%, rgba(255,210,63,.16), transparent 70%); }
  .fondo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,18,22,.35), rgba(15,18,22,.78)); }
  @media (prefers-reduced-motion: reduce) { .fondo i { animation: none; } .fondo .f1 { opacity: .28; } }

  .app { position: relative; z-index: 1; max-width: 62rem; margin: 0 auto; padding: .6rem 1rem 5rem; }
  .arriba { display: flex; align-items: center; gap: .8rem; padding: .4rem 0; }
  .arriba a { color: #c9d1d9; text-decoration: none; font-size: .9rem; }
  .arriba .sello { margin-left: auto; font: .75rem var(--mono, monospace); color: #8b95a1; }
  .logo { font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 800; letter-spacing: -.02em; margin: 0; line-height: 1;
    background: linear-gradient(90deg, var(--rr-a), var(--rr-d) 55%, var(--rr-c)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lema { color: #c9d1d9; margin: .2rem 0 .8rem; font-size: 1.05rem; }

  /* Las tres fases, arriba, siempre a la vista */
  .fases { display: flex; gap: .5rem; margin: .6rem 0 1rem; }
  .fases button { flex: 1; min-height: 60px; border-radius: 16px; border: 2px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
    color: #e8edf2; font-size: 1.05rem; font-weight: 700; backdrop-filter: blur(6px); cursor: pointer; transition: transform .15s, background .2s; }
  .fases button small { display: block; font-weight: 500; font-size: .72rem; color: #a9b4bf; }
  .fases button[aria-pressed="true"] { background: linear-gradient(135deg, var(--rr-a), #ffb703); color: #1b1d21; border-color: transparent; transform: translateY(-2px); }
  .fases button[aria-pressed="true"] small { color: #3a3412; }
  .fases button.listo::after { content: " ✓"; color: var(--rr-b); }
  .fases button[aria-pressed="true"].listo::after { color: #1b6b43; }

  .panel { background: rgba(20,24,30,.72); border: 1px solid rgba(255,255,255,.12); border-radius: 22px; padding: 1rem 1.1rem; margin: .8rem 0; backdrop-filter: blur(8px); animation: entra .35s ease both; }
  @keyframes entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .panel h2 { margin: 0 0 .2rem; font-size: 1.5rem; }
  .gris { color: #a9b4bf; }
  .adulto { display: inline-block; font-size: .78rem; font-weight: 700; background: rgba(76,201,240,.18); color: var(--rr-c); border: 1px solid rgba(76,201,240,.4); border-radius: 999px; padding: .1rem .7rem; }

  .pista { margin: .9rem 0; border-left: 5px solid var(--c, var(--rr-c)); padding-left: .8rem; }
  .pista h3 { margin: 0; font-size: 1.2rem; }
  .pista .q { color: #a9b4bf; font-size: .85rem; margin: 0 0 .3rem; }
  .paso { display: flex; gap: .8rem; align-items: flex-start; padding: .65rem .2rem; border-top: 1px solid rgba(255,255,255,.08); }
  .paso input[type=checkbox] { width: 34px; height: 34px; flex: none; accent-color: var(--rr-b); margin-top: .1rem; }
  .paso .t { flex: 1; font-size: 1.08rem; }
  .paso.hecho .t > b { color: #7d8793; text-decoration: line-through; }
  .paso code, .cmd { display: inline-block; background: #0b0e12; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: .2rem .6rem; margin: .25rem .3rem .1rem 0;
    font-family: var(--mono, ui-monospace, monospace); font-size: 1.05rem; color: var(--rr-a); }
  .paso .nota { color: #a9b4bf; font-size: .92rem; margin: .2rem 0 0; }
  .paso .ve { color: var(--rr-b); font-size: .95rem; margin: .2rem 0 0; }
  .avance { height: 10px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; margin: .4rem 0 0; }
  .avance i { display: block; height: 100%; background: linear-gradient(90deg, var(--rr-b), var(--rr-c)); border-radius: 999px; transition: width .4s; }

  .btn-grande { min-height: 60px; padding: 0 1.4rem; border-radius: 16px; border: 0; font-size: 1.15rem; font-weight: 800; cursor: pointer;
    background: linear-gradient(135deg, var(--rr-b), var(--rr-c)); color: #0b1a14; margin: .4rem .4rem 0 0; }
  .btn-grande.sec { background: rgba(255,255,255,.1); color: #e8edf2; border: 1px solid rgba(255,255,255,.2); }
  .btn-grande:disabled { opacity: .4; }

  /* El selector de juegos: tarjetas grandes, de a una por dedo */
  .juegos { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .8rem; margin-top: .6rem; }
  .juego { text-align: left; border-radius: 20px; padding: 1rem; border: 2px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #f3f5f7; cursor: pointer;
    transition: transform .15s, border-color .2s, background .2s; min-height: 150px; font: inherit; }
  .juego:hover, .juego:focus-visible { transform: translateY(-3px); border-color: var(--rr-a); }
  .juego[aria-pressed="true"] { border-color: var(--rr-a); background: rgba(255,210,63,.14); }
  .juego .ic { font-size: 2.6rem; display: block; }
  .juego b { font-size: 1.15rem; display: block; margin: .2rem 0; }
  .juego span.m { color: #c9d1d9; font-size: .9rem; display: block; }
  .juego .tag { display: inline-block; margin-top: .5rem; font-size: .75rem; background: rgba(255,255,255,.1); border-radius: 999px; padding: .1rem .6rem; color: #d7dde4; }
  .hoy { background: var(--rr-a) !important; color: #1b1d21 !important; font-weight: 800; }

  /* El tablero */
  .rondas { display: flex; gap: .4rem; margin: .4rem 0 .8rem; overflow-x: auto; }
  .rondas button { flex: 1 0 8rem; min-height: 56px; border-radius: 14px; border: 2px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #e8edf2; font-weight: 700; font-size: .95rem; cursor: pointer; }
  .rondas button[aria-pressed="true"] { border-color: var(--rr-d); background: rgba(255,107,157,.2); }
  .roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .7rem; margin: .6rem 0; }
  .rol { border-radius: 18px; padding: .8rem .9rem; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); }
  .rol .ic { font-size: 1.9rem; }
  .rol .quien { display: block; font-size: 1.5rem; font-weight: 800; color: var(--rr-a); }
  .rol .nom { font-weight: 700; }
  .rol .hace { color: #b9c3cd; font-size: .92rem; margin-top: .15rem; }
  .rol.ayuda { opacity: .85; }
  .estrellas { font-size: 2.2rem; letter-spacing: .2rem; }
  .fila { display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; margin: .5rem 0; }
  .fila label { display: flex; gap: .5rem; align-items: center; font-size: 1.05rem; }
  .fila input[type=number] { width: 5rem; min-height: 52px; font-size: 1.2rem; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: #0b0e12; color: #fff; padding: 0 .6rem; }
  .fila input[type=checkbox] { width: 32px; height: 32px; accent-color: var(--rr-b); }
  .equipo input[type=text] { min-height: 52px; font-size: 1.1rem; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: #0b0e12; color: #fff; padding: 0 .8rem; width: 100%; box-sizing: border-box; }
  .equipo .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .5rem; }
  .festejo { text-align: center; font-size: 1.3rem; font-weight: 800; color: var(--rr-a); }
  .nivel-pide { display: inline-block; background: rgba(255,210,63,.18); border: 1px solid var(--rr-a); color: var(--rr-a); border-radius: 12px; padding: .2rem .8rem; font-weight: 800; margin: .3rem 0; }
  ul.cosas { color: #c9d1d9; padding-left: 1.2rem; margin: .3rem 0; }
  a.enlace { color: var(--rr-c); }

  /* lo que comparten la puerta y el registro */
  .tarj { background: rgba(20,24,30,.78); border: 1px solid rgba(255,255,255,.14); border-radius: 18px; padding: 1rem; margin: .8rem 0; backdrop-filter: blur(8px); }
  .tarj label, .panel label { display: block; margin: .5rem 0 .15rem; color: #a9b4bf; font-size: .9rem; }
  .tarj input, .panel input[type=text], .panel input:not([type]), .panel input[type=number], .panel input[type=email] { width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: #0b0e12; color: #fff; padding: 0 .8rem; font: inherit; box-sizing: border-box; }
  .tarj button, .tarj .p { min-height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,.2); background: #222a33; color: #f3f5f7; padding: 0 1.1rem; font: inherit; font-weight: 700; margin: .4rem .4rem 0 0; cursor: pointer; }
  .tarj button.p { background: linear-gradient(135deg, var(--rr-a), #ffb703); color: #1b1d21; border-color: transparent; }
  .msj { padding: .5rem .8rem; border-radius: 12px; margin: .5rem 0; border: 1px solid rgba(255,255,255,.2); }
  .msj.mal { border-color: #ff6b6b; color: #ff9b9b; } .msj.ok { border-color: var(--rr-b); color: var(--rr-b); }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0; }
  .chip { min-height: 52px; border-radius: 999px; border: 2px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); color: #f3f5f7; padding: 0 1.1rem; font: inherit; font-weight: 700; cursor: pointer; }
  .chip small { color: #a9b4bf; font-weight: 500; } .chip[aria-pressed="true"] { background: var(--rr-b); color: #0b1a14; border-color: transparent; } .chip[aria-pressed="true"] small { color: #1b4d36; }
  .panel .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .5rem; }
  .arriba .salir { margin-left: auto; min-height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: transparent; color: #c9d1d9; padding: 0 .9rem; cursor: pointer; }
</style>
</head>
<body>
<!--
  jugar.html — «A jugar con Roli»: la pantalla de la TABLET al costado durante una ronda (14-nov-2026).
  Sello: jugar-1. Mauro: «la información sensible va a ser sobre todo la que se ingrese cuando se empieza a jugar:
  los nombres, los detalles de las personas y los datos que se vayan almacenando del juego».

  Por eso esta pantalla pide LOGIN y guarda en la base privada `roli-467a4` (jugadores y partidas), no en el
  navegador. Tres fases: 1 Preparar (el adulto), 2 Elegir juego y quiénes juegan, 3 el tablero ronda por ronda.
  Los juegos, los roles y las cuentas son de roli.js del panel (maurogasta-crypto/datos): una sola copia, que se
  trae al abrir. La puerta es acceso.js; el SDK sólo se toca en firebase-init.js.
-->
<div class="fondo" aria-hidden="true"><i class="f1"></i><i class="f2"></i></div>
<main class="app">
  <div class="arriba"><a href="index.html">← Registro</a><span class="sello" id="sello"></span><button class="salir" id="salir">Salir</button></div>
  <h1 class="logo">¡A jugar con Roli!</h1>
  <div id="puerta"></div>
  <div id="juego" hidden>
    <p class="lema" id="lema"></p>
    <nav class="fases" id="fases" aria-label="Pasos de la ronda"></nav>
    <section id="cuerpo"></section>
  </div>
</main>
<script type="module">
import * as I from "./firebase-init.js";
import * as R from "./registro.js";
import * as A from "./acceso.js";

const SELLO = "jugar-1";
const $ = (id) => document.getElementById(id);
const v = $("puerta"), cuerpo = $("cuerpo");
$("sello").textContent = [SELLO, I.VERSION, R.VERSION, A.VERSION].join(" · ");

// Los juegos, los roles y las cuentas son de roli.js del panel (datos): una sola copia. Sin él no hay juegos.
let D = null;
const cargarDatos = async () => {
  try { D = await import("https://maurogasta-crypto.github.io/datos/roli.js"); return true; }
  catch (e) { return false; }
};

let user = null, ficha = null, fase = 1, bajar = [];
let juegos = [], jugadores = [], partidas = [], P = null, pid = null, elegidos = new Set(), juegoElegido = "";
let prep = {}; try { prep = JSON.parse(sessionStorage.getItem("roli_prep") || "{}"); } catch (e) {}   // sólo qué pasos de preparación se tildaron; no es información de personas
const guardarPrep = () => { try { sessionStorage.setItem("roli_prep", JSON.stringify(prep)); } catch (e) {} };
const esc = R.esc, estrellas = (n) => "⭐".repeat(n) + "☆".repeat(Math.max(0, 3 - n));
const COLORES = ["var(--rr-c)", "var(--rr-b)", "var(--rr-d)", "var(--rr-a)"];
const quien = () => ({ uid: user.uid, nombre: ficha.nombre || user.email });
const limpiar = () => { bajar.forEach((f) => { try { f(); } catch (e) {} }); bajar = []; };
const din = () => D.DINAMICAS.find((d) => d.id === (P ? P.juego : juegoElegido)) || D.dinamicaDe(new Date().toISOString().slice(0, 10));
const pistas = () => D.preparacionDe(din());
const pasosPrep = () => pistas().flatMap((g) => g.pasos.map((_, i) => g.id + ":" + i));
const prepHecha = () => { const t = pasosPrep(); return t.length > 0 && t.every((k) => prep[k]); };
const guarda = async (campos) => { try { await I.updateDoc(I.doc(I.db, "partidas", pid), campos); } catch (e) { A.aviso(cuerpo, A.explicar(e)); } };

function escuchar() {
  limpiar();
  const lista = (col, f) => bajar.push(I.onSnapshot(I.query(I.collection(I.db, col), I.orderBy("creado", "desc"), I.limit(60)), (s) => { f(s.docs.map((x) => ({ id: x.id, ...x.data() }))); pintar(true); }, (e) => A.aviso(cuerpo, A.explicar(e))));
  lista("jugadores", (d) => { jugadores = d.filter((x) => x.activo !== false); });
  lista("partidas", (d) => {
    partidas = d;
    if (pid) { const p = d.find((x) => x.id === pid); if (p) P = p; }
  });
}

function pintarFases() {
  const f = [["1", "Preparar", "el adulto con los chicos"], ["2", "Elegir", "el juego y quiénes juegan"], ["3", "¡A jugar!", "ronda por ronda"]];
  $("fases").innerHTML = f.map((x, i) => '<button data-f="' + (i + 1) + '" aria-pressed="' + (fase === i + 1) + '"' + ((i === 0 && prepHecha()) ? ' class="listo"' : "") + ">" + x[0] + ". " + x[1] + "<small>" + x[2] + "</small></button>").join("");
}

function vPreparar() {
  const d = din(), gs = pistas(), total = pasosPrep().length, hechos = pasosPrep().filter((k) => prep[k]).length;
  let h = '<div class="panel"><span class="adulto">👩‍🔧 Para el adulto</span><h2>Dejar a Roli listo</h2>'
    + '<p class="gris" style="margin:.2rem 0">Se hace una vez al empezar la partida, con los chicos al lado mirando y ayudando. Tildá cada paso cuando esté.</p>'
    + '<p>El juego pide <span class="nivel-pide">nivel ' + D.nivelDeJuego(d) + "</span> en el programa (" + d.ic + " " + esc(d.titulo) + ").</p>"
    + '<div class="avance"><i style="width:' + (total ? Math.round(100 * hechos / total) : 0) + '%"></i></div><p class="gris" style="margin:.2rem 0">' + hechos + " de " + total + " pasos</p></div>";
  gs.forEach((g, gi) => {
    h += '<div class="panel pista" style="--c:' + COLORES[gi % 4] + '"><h3>' + g.ic + " " + esc(g.titulo) + '</h3><p class="q">' + esc(g.quien) + "</p>";
    g.pasos.forEach((p, i) => {
      const k = g.id + ":" + i, ok = prep[k];
      h += '<div class="paso' + (ok ? " hecho" : "") + '"><input type="checkbox" data-p="' + k + '"' + (ok ? " checked" : "") + ' aria-label="Hecho"><div class="t"><b>' + esc(p.t) + "</b><br>"
        + (p.escribi || []).map((c) => "<code>" + esc(c) + "</code>").join("") + (p.nota ? '<p class="nota">' + esc(p.nota) + "</p>" : "") + (p.ve ? '<p class="ve">👉 ' + esc(p.ve) + "</p>" : "") + "</div></div>";
    });
    h += "</div>";
  });
  h += '<div class="panel"><ul class="cosas">' + d.cosas.map((c) => "<li>" + esc(c) + "</li>").join("") + "</ul>"
    + '<button class="btn-grande" id="irElegir"' + (prepHecha() ? "" : " disabled") + '>Listo, ¡a elegir el juego! →</button>'
    + '<button class="btn-grande sec" id="irElegirYa">Saltear: ya está preparado</button><button class="btn-grande sec" id="prepReset">↺ Destildar todo</button></div>';
  cuerpo.innerHTML = h;
}

function vElegir() {
  const enCurso = partidas.filter((p) => p.estado === "en curso" && (p.uid === user.uid));
  let h = "";
  if (enCurso.length) h += '<div class="panel"><h2>▶ Seguir una partida</h2>' + enCurso.slice(0, 3).map((p) => '<button class="btn-grande sec" data-seguir="' + esc(p.id) + '">' + esc(p.juego) + " · " + esc((p.equipo || []).join(", ")) + " · ronda " + ((p.actual || 0) + 1) + "</button>").join("") + "</div>";
  h += '<div class="panel"><h2>¿A qué jugamos?</h2><p class="gris" style="margin:.2rem 0">Todos son en equipo: nadie compite, juntos suman ⭐.</p><div class="juegos">'
    + D.DINAMICAS.map((d) => '<button class="juego" data-g="' + esc(d.id) + '" aria-pressed="' + (d.id === (juegoElegido || din().id)) + '"><span class="ic">' + d.ic + "</span><b>" + esc(d.titulo) + '</b><span class="m">' + esc(d.meta) + '</span><span class="tag">' + d.minutos + " min · nivel " + D.nivelDeJuego(d) + "</span></button>").join("") + "</div></div>";
  h += '<div class="panel equipo"><h2>👥 ¿Quiénes juegan?</h2><p class="gris" style="margin:.2rem 0">Tocá a cada persona que juega (mínimo dos). Los datos quedan guardados en la base privada, no en este aparato.</p><div class="chips">'
    + (jugadores.length ? jugadores.map((j) => '<button class="chip" data-j="' + esc(j.id) + '" aria-pressed="' + elegidos.has(j.id) + '">' + esc(j.nombre) + (j.edad ? ' <small>' + esc(j.edad) + "</small>" : "") + "</button>").join("") : '<span class="gris">Todavía no hay nadie cargado: agregá a la primera persona acá abajo.</span>') + "</div>"
    + '<h3 style="margin:1rem 0 .2rem;font-size:1rem">Sumar a alguien</h3><div class="grid"><input id="jn" maxlength="20" placeholder="Nombre" aria-label="Nombre"><input id="je" type="number" min="1" max="99" inputmode="numeric" placeholder="Edad (opcional)" aria-label="Edad"><input id="jo" maxlength="200" placeholder="Algo para recordar (opcional)" aria-label="Nota"></div>'
    + '<div class="fila"><button class="btn-grande sec" id="jmas">＋ Guardar y sumar al equipo</button></div></div>'
    + '<div class="panel"><button class="btn-grande" id="jugar"' + (elegidos.size >= 2 ? "" : " disabled") + ">¡A jugar! →</button>" + (elegidos.size < 2 ? '<span class="gris"> Faltan jugadores: elegí al menos dos.</span>' : "") + "</div>";
  cuerpo.innerHTML = h;
}

function vTablero() {
  if (!P) { cuerpo.innerHTML = '<div class="panel"><p>No hay una partida en marcha. Elegí un juego y quiénes juegan.</p><button class="btn-grande" data-f="2">Ir a elegir →</button></div>'; return; }
  const d = din(), eq = P.equipo || [], act = Math.min(Math.max(P.actual || 0, 0), d.rondas.length - 1), r = d.rondas[act];
  const e = (P.rondas || {})[r.id] || {}, est = D.estrellasPorIntentos(e.intentos, !!e.logrado);
  const reparto = D.asignarRoles(eq, r.roles, act), por = {}; reparto.forEach((x) => { (por[x.rol] ||= []).push(x.persona); });
  const ayudan = eq.filter((j) => !reparto.some((x) => x.persona === j));
  const tot = D.totalEstrellas(P.rondas || {}, d.rondas);
  if (P.estado === "terminada") return vFin(d, tot);
  let h = '<div class="panel"><h2>' + d.ic + " " + esc(d.titulo) + '</h2><div class="rondas">'
    + d.rondas.map((x, i) => { const s = D.estrellasPorIntentos(((P.rondas || {})[x.id] || {}).intentos, !!((P.rondas || {})[x.id] || {}).logrado); return '<button data-r="' + i + '" aria-pressed="' + (i === act) + '">' + x.ic + " Ronda " + (i + 1) + (s ? "<br>" + estrellas(s) : "") + "</button>"; }).join("")
    + '</div><div class="fila"><b style="font-size:1.4rem">⭐ ' + tot.total + '</b><span class="gris">meta del equipo: ' + d.metaEstrellas + "</span></div></div>";
  h += '<div class="panel"><h2>Ronda ' + (act + 1) + " · " + esc(r.titulo) + '</h2><p class="gris" style="margin:.1rem 0">⏱ ' + r.minutos + " min · Nivel " + r.nivel + " · " + esc(r.logro) + "</p><p>" + esc(r.que) + "</p>";
  if (r.ojos) h += '<p class="gris">⚠ ' + esc(D.AVISO_OJOS) + "</p>";
  h += '<div class="roles">' + r.roles.map((ro) => '<div class="rol"><span class="ic">' + ro.ic + '</span><span class="quien">' + esc((por[ro.id] || ["¿?"]).join(" y ")) + '</span><span class="nom">' + esc(ro.nombre) + '</span><div class="hace">' + esc(ro.hace) + "</div></div>").join("")
    + '<div class="rol"><span class="ic">📱</span><span class="quien">Tablet</span><span class="nom">Quien la tiene</span><div class="hace">Lee los pasos en voz alta y los tilda. Se pasa de mano en cada ronda, junto con los lugares.</div></div>'
    + (ayudan.length ? '<div class="rol ayuda"><span class="ic">👀</span><span class="quien">' + esc(ayudan.join(" y ")) + '</span><span class="nom">Ayuda</span><div class="hace">Mira, cuenta los intentos y avisa si algo se complica. En la próxima ronda le toca otro lugar.</div></div>' : "") + "</div></div>";
  h += '<div class="panel">';
  r.pasos.forEach((p, i) => {
    const ok = (P.hechos || {})[r.id + ":" + i];
    h += '<div class="paso' + (ok ? " hecho" : "") + '"><input type="checkbox" data-jp="' + r.id + ":" + i + '"' + (ok ? " checked" : "") + ' aria-label="Hecho"><div class="t"><b>' + (i + 1) + ". " + esc(p.t) + "</b><br>"
      + (p.escribi || []).map((c) => "<code>" + esc(c) + "</code>").join("") + (p.ve ? '<p class="ve">👉 ' + esc(p.ve) + "</p>" : "") + "</div></div>";
  });
  if (r.entrena) h += '<p class="nota gris">📏 <b>Entrenamiento:</b> ' + esc(r.entrena) + "</p>";
  h += '<div class="fila"><label>Intentos hasta lograrlo <input type="number" inputmode="numeric" min="1" max="20" data-int="' + r.id + '" value="' + esc(String(e.intentos ?? "")) + '"></label>'
    + '<label><input type="checkbox" data-logro="' + r.id + '"' + (e.logrado ? " checked" : "") + '> ¡Lo logramos!</label></div>'
    + (est ? '<p class="festejo"><span class="estrellas">' + estrellas(est) + "</span><br>" + esc(est === 3 ? "¡Al primer intento!" : est === 2 ? "¡Muy bien, en equipo!" : "¡Lo lograron! La próxima sale mejor.") + "</p>" : "")
    + '<div class="fila">' + (act > 0 ? '<button class="btn-grande sec" id="ant">← Ronda anterior</button>' : "")
    + (act < d.rondas.length - 1 ? '<button class="btn-grande" id="sig">¡Rotamos! Ronda ' + (act + 2) + " →</button>" : '<button class="btn-grande" id="fin">🎉 Terminamos</button>') + "</div></div>";
  cuerpo.innerHTML = h;
}

function vFin(d, tot) {
  const m = P.medidas || {};
  cuerpo.innerHTML = '<div class="panel"><h2>🎉 ¡Terminaron!</h2><p class="festejo"><span class="estrellas">⭐ ' + tot.total + "</span><br>" + esc(D.mensajeDeEquipo(tot.total, tot.max, d.metaEstrellas)) + "</p></div>"
    + '<div class="panel"><h2>📏 Las medidas de hoy</h2><p class="gris" style="margin:.2rem 0">Si midieron algo, anótenlo: sirve para ajustar a Roli. Queda guardado con la partida.</p><div class="grid">'
    + '<input id="m1" type="number" inputmode="numeric" placeholder="Velocidad usada" value="' + esc(m.velocidad ?? "") + '"><input id="m2" type="number" step="0.1" inputmode="decimal" placeholder="Segundos para 1 metro" value="' + esc(m.segundosPorMetro ?? "") + '"><input id="m3" type="number" step="0.1" inputmode="decimal" placeholder="Segundos de giro 90°" value="' + esc(m.giro90 ?? "") + '"></div>'
    + '<input id="m4" maxlength="400" placeholder="Algo más que notaron" style="margin-top:.5rem" value="' + esc(P.nota || "") + '"><button class="btn-grande" id="medidas">Guardar las medidas</button></div>'
    + '<div class="panel"><ul class="cosas">' + d.cierre.map((c) => "<li>" + esc(c) + "</li>").join("") + '</ul><p class="gris">Si recalibraron a Roli: en la consola <code>calibrar guardar</code> y <code>calibrar exportar</code>, y pegá la lista en «Calibraciones» del registro.</p>'
    + '<button class="btn-grande" id="otra">Otra partida →</button><a class="btn-grande sec" style="display:inline-flex;align-items:center;text-decoration:none" href="index.html">Ir al registro</a></div>';
}

/* Un repintado que llega de la base mientras alguien tiene el dedo apoyado le saca el botón de abajo y se pierde el toque
   (pasa al escribir los intentos y tocar «Rotamos»: el cambio sale al soltar el foco). Se espera a que se suelte. */
let tocando = false, pendiente = false;
cuerpo.addEventListener("pointerdown", () => { tocando = true; });
const soltar = () => { if (!tocando) return; tocando = false; setTimeout(() => { if (pendiente) { pendiente = false; pintar(); } }, 60); };
document.addEventListener("pointerup", soltar); document.addEventListener("pointercancel", soltar);
function pintar(deEscucha) {
  if (!user || !D) return;
  if (deEscucha && tocando) { pendiente = true; return; }
  if (deEscucha && document.activeElement && cuerpo.contains(document.activeElement) && (document.activeElement.tagName === "TEXTAREA" || (document.activeElement.tagName === "INPUT" && ["text", "number"].includes(document.activeElement.type)))) return;   // no pisar lo que se está escribiendo
  pintarFases();
  $("lema").textContent = fase === 1 ? "Primero lo prepara un adulto, y los chicos miran y ayudan." : fase === 2 ? "Elijan el juego y quiénes juegan." : "Uno lee acá, otro escribe en la laptop, otro prepara el terreno… ¡y se rotan!";
  if (fase === 1) vPreparar(); else if (fase === 2) vElegir(); else vTablero();
}
const irA = (f) => { fase = f; pintar(); window.scrollTo({ top: 0 }); };

$("fases").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-f]"); if (b) irA(+b.dataset.f); });
cuerpo.addEventListener("change", (ev) => {
  const t = ev.target, k = t.dataset;
  if (k.p) { if (t.checked) prep[k.p] = 1; else delete prep[k.p]; guardarPrep(); pintar(); return; }
  if (!P) return;
  if (k.jp) guarda({ ["hechos." + k.jp]: t.checked ? true : false });
  else if (k.int != null) { const n = t.value === "" ? null : Math.max(1, Math.min(20, +t.value)); const cur = (P.rondas || {})[k.int] || {}; const nuevo = { intentos: n, logrado: n != null ? true : !!cur.logrado }; guardarEst(k.int, nuevo); }
  else if (k.logro != null) { const cur = (P.rondas || {})[k.logro] || {}; guardarEst(k.logro, { intentos: cur.intentos ?? null, logrado: t.checked }); }
});
function guardarEst(id, valor) {
  const rondas = { ...(P.rondas || {}), [id]: valor };
  guarda({ ["rondas." + id]: valor, estrellas: D.totalEstrellas(rondas, din().rondas).total });
}
cuerpo.addEventListener("click", async (ev) => {
  const b = ev.target.closest("button, a"); if (!b || b.tagName === "A") return;
  const k = b.dataset, id = b.id;
  if (k.f) return irA(+k.f);
  if (k.g) { juegoElegido = k.g; return pintar(); }
  if (k.j) { if (elegidos.has(k.j)) elegidos.delete(k.j); else elegidos.add(k.j); return pintar(); }
  if (k.seguir) { pid = k.seguir; P = partidas.find((p) => p.id === pid); juegoElegido = P ? P.juego : juegoElegido; return irA(3); }
  if (k.r != null) return guarda({ actual: +k.r });
  if (id === "irElegir" || id === "irElegirYa") return irA(2);
  if (id === "prepReset") { prep = {}; guardarPrep(); return pintar(); }
  if (id === "jmas") {
    try {
      const doc = R.docJugador({ nombre: $("jn").value, edad: $("je").value, nota: $("jo").value }, quien());
      const ref = await I.addDoc(I.collection(I.db, "jugadores"), doc); elegidos.add(ref.id); pintar();
    } catch (e) { A.aviso(cuerpo, e.message && !e.code ? e.message : A.explicar(e)); }
    return;
  }
  if (id === "jugar") {
    try {
      const eq = jugadores.filter((j) => elegidos.has(j.id)).sort((a, b) => a.creado - b.creado), d = din();
      const doc = R.docPartida({ juego: d.id, equipo: eq.map((j) => j.nombre), jugadores: eq.map((j) => j.id), meta: d.metaEstrellas }, quien());
      const ref = await I.addDoc(I.collection(I.db, "partidas"), doc); pid = ref.id; P = { id: pid, ...doc }; juegoElegido = d.id; irA(3);
    } catch (e) { A.aviso(cuerpo, e.message && !e.code ? e.message : A.explicar(e)); }
    return;
  }
  if (id === "sig") return guarda({ actual: (P.actual || 0) + 1 });
  if (id === "ant") return guarda({ actual: Math.max(0, (P.actual || 0) - 1) });
  if (id === "fin") return guarda({ estado: "terminada", fin: Date.now() });
  if (id === "medidas") {
    const n = (x) => (x === "" || !Number.isFinite(Number(x)) || Number(x) < 0 ? null : Number(x));
    return guarda({ medidas: { velocidad: n($("m1").value), segundosPorMetro: n($("m2").value), giro90: n($("m3").value) }, nota: $("m4").value.slice(0, 400) }).then(() => A.aviso(cuerpo, "Medidas guardadas.", "ok"));
  }
  if (id === "otra") { P = null; pid = null; elegidos = new Set(); juegoElegido = ""; prep = {}; guardarPrep(); return irA(1); }
});

(async () => {
  if (!(await cargarDatos())) { v.innerHTML = '<div class="msj mal">No pude traer los juegos (roli.js del panel). Revisá la conexión y volvé a abrir la página.</div>'; return; }
  A.abrir(v, (s) => {
    user = s.user; ficha = s.ficha; v.innerHTML = ""; $("juego").hidden = false;
    $("salir").onclick = () => I.signOut(I.auth);
    escuchar(); pintar();
  }, () => { limpiar(); $("juego").hidden = true; user = null; P = null; pid = null; });
})();
</script>
</body>
