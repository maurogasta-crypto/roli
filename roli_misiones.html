<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roli · Misiones de la consola</title>
<style>
:root{--bg:#e9f0f7;--c:#fff;--t:#17233a;--m:#58657c;--l:#cfdae8;--code:#f2f6fb;--ok:#14894a;--r:#d32f3f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--c:#192236;--t:#eaf0fb;--m:#9db0cc;--l:#2c3a55;--code:#0f1829;--ok:#44c27c;--r:#ff6b78;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:18px/1.5 "Trebuchet MS",Verdana,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #2b6fd6;outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:14px 20px;background:var(--c);border-bottom:2px solid var(--l)}
h1{font-size:1.35rem;margin:0}
.pg{flex:1;min-width:170px}
.pg small{color:var(--m)}
.barra{height:10px;background:var(--l);border-radius:6px;overflow:hidden;margin-top:4px}
#bar{height:100%;width:0;background:var(--ok);transition:width .3s}
.stop{background:var(--r);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700}
.tabs{display:flex;gap:6px}
.tabs button{border:2px solid var(--l);background:var(--c);border-radius:10px;padding:8px 14px;font-weight:700}
.tabs button.on{background:var(--t);color:var(--bg);border-color:var(--t)}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:18px;max-width:1180px;margin:0 auto;padding:18px}
#idx{background:var(--c);border-radius:14px;padding:10px;align-self:start;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:10px}
#idx h3{margin:12px 6px 4px;font-size:1rem;color:var(--k)}
.it{display:flex;justify-content:space-between;gap:6px;width:100%;text-align:left;background:none;border:0;border-left:5px solid transparent;border-radius:8px;padding:6px 8px;font-size:.95rem}
.it:hover{background:var(--code)}
.it.cur{background:var(--code);border-left-color:var(--k);font-weight:700}
#mision,#cmds{background:var(--c);border-radius:14px;padding:22px 26px;border-top:8px solid var(--k)}
#cmds{border-top-color:var(--l)}
.et{display:inline-block;background:var(--k);color:#fff;border-radius:20px;padding:2px 14px;font-size:.9rem}
h2{font-size:1.6rem;margin:10px 0 6px;line-height:1.25}
.st{color:#e8a800;white-space:nowrap}
.cmd{display:flex;align-items:center;gap:10px;background:var(--code);border:2px solid var(--l);border-radius:10px;margin:8px 0;padding:6px 8px 6px 14px}
.cmd code{flex:1;font:700 1.15rem ui-monospace,Consolas,monospace;word-break:break-word}
.cmd small{color:var(--m);font-size:.85rem;flex:1.4}
.cp,.sec{background:var(--k);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:700;min-width:96px}
.cp.hecho,.sec.hecho{background:var(--ok)}
.sec{margin:6px 0 4px}
.nota{color:var(--m);font-size:.95rem}
.acc{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:22px 0 8px;padding-top:16px;border-top:2px dashed var(--l)}
.hb{border:3px solid var(--ok);background:none;color:var(--ok);border-radius:12px;padding:10px 18px;font-weight:700}
.hb.on{background:var(--ok);color:#fff}
.th{border:3px solid var(--l);background:none;border-radius:12px;font-size:1.6rem;padding:2px 14px;filter:grayscale(1);opacity:.7}
.th.on{filter:none;opacity:1;border-color:var(--k);background:var(--code)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.nav button{border:2px solid var(--l);background:var(--code);border-radius:10px;padding:10px 18px;font-weight:700}
.nav button:disabled{opacity:.35;cursor:default}
#cmds section{margin-bottom:18px}
#cmds h3{color:var(--k);margin:6px 0}
.pie{text-align:center;color:var(--m);font-size:.9rem;padding:0 18px 24px}
.pie button{background:none;border:0;color:var(--m);text-decoration:underline;font-size:.9rem}
@media(max-width:820px){.wrap{grid-template-columns:1fr}#idx{position:static;max-height:260px}}
</style>
</head>
<body>
<header>
  <h1>🤖 Roli · Misiones</h1>
  <div class="pg"><small id="prog"></small><div class="barra"><div id="bar"></div></div></div>
  <div class="tabs"><button data-v="m" class="on">Misiones</button><button data-v="c">Todos los comandos</button></div>
  <button class="stop cp-stop" data-t="parar" title="Copia la palabra parar">🛑 Copiar «parar»</button>
</header>

<div class="wrap">
  <nav id="idx" aria-label="Índice de misiones"></nav>
  <main>
    <article id="mision"></article>
    <div id="cmds" hidden></div>
  </main>
</div>
<p class="pie">Para pegar en la consola de Roli: <b>Ctrl + Shift + V</b>, y después Enter. Las palabras van sin tildes. · <button data-a="reset">Borrar progreso</button></p>

<script>
const S=[
{n:"Hablar",i:"💬",k:"#2b6fd6",w:[["hola","Saluda"],["ayuda","Lista de palabras"],["info","Nivel y mapa de Roli"],["di hola","Roli repite el texto"],["led 1","Enciende la luz"],["led 0","Apaga la luz"],["parpadear 5","Parpadea 5 veces (máximo 20)"]],m:[
{id:"1.1",t:"El saludo",e:1,x:"Escribí los tres comandos. ¿Qué nivel dice que es Roli? ¿Qué palabras de la lista no conocías?",c:["hola","ayuda","info"]},
{id:"1.2",t:"Roli repite",e:1,x:"Con <b>di</b>, Roli repite lo que sigue. Inventá un mensaje secreto para el otro.",c:["di hola Kala","di soy Yacko"]},
{id:"1.3",t:"Luces",e:2,x:"Desafío: escribí tu inicial con destellos cortos y largos. ¿Qué pasa con <b>parpadear 50</b>?",c:["led 1","led 0","parpadear 5","parpadear 50"]},
{id:"1.4",t:"Una palabra que no existe",e:1,x:"Roli te va a decir que no la conoce. Así sabés qué palabras sí entiende.",c:["bailar"]}]},
{n:"Moverse",i:"🚗",k:"#e0701f",w:[["adelante","Avanza (frena solo a los 4 s)"],["atras","Retrocede"],["izquierda","Gira a la izquierda"],["derecha","Gira a la derecha"],["parar","¡Frena YA!"],["d","Atajos: d adelante, a atras, i izquierda, e derecha, r parar"],["teclado","Manejar con flechas (q vuelve)"]],m:[
{id:"2.1",t:"Primeros pasos",e:1,x:"Probá las cuatro órdenes. Después escribí <b>adelante</b> y <b>no</b> escribas parar: ¿qué hace Roli a los 4 segundos?",c:["adelante","parar","atras","parar"]},
{id:"2.2",t:"Los atajos",e:2,x:"Probá cada letra y descubrí qué hace. ¿Cuál de ellas puede confundirte? (Pista: la <b>e</b>.)",c:["d","r","a","r","i","r","e","r"]},
{id:"2.3",t:"Modo teclado",e:1,x:"Manejá a Roli con las flechas o W A S D. Espacio frena, + y − cambian la velocidad, <b>q</b> vuelve a la consola. Desafío: llevalo de una cinta a otra y cronometrá.",c:["teclado"]}]},
{n:"Tiempo y velocidad",i:"⏱️",k:"#8a4fd6",w:[["adelante 2","Avanza 2 segundos (de 0,1 a 20)"],["derecha 0,5","Gira medio segundo"],["velocidad 150","Velocidad de 60 a 255"],["velocidad izq 120","Solo la rueda izquierda"],["velocidad der 120","Solo la rueda derecha"],["zigzag 1","Zigzag encendido"],["zigzag 0","Zigzag apagado"]],m:[
{id:"3.1",t:"El cronómetro",e:1,x:"Marcá la salida con cinta y medí cuánto avanza Roli en cada tiempo. Anotalo.",c:["adelante 1","adelante 2","adelante 3"]},
{id:"3.2",t:"El cuarto de vuelta",e:2,x:"¿Cuántos segundos tiene que girar para dar un cuarto de vuelta, como la esquina de un cuadrado? Anotá cuál queda mejor.",c:["derecha 0,4","derecha 0,5","derecha 0,6"]},
{id:"3.3",t:"El cuadrado a mano",e:2,x:"Cambiá <b>0,5</b> por el tiempo que encontraste. ¿Vuelve al punto de salida? ¿Por cuántos centímetros no llegó?",c:["adelante 2","derecha 0,5","adelante 2","derecha 0,5","adelante 2","derecha 0,5","adelante 2","derecha 0,5"]},
{id:"3.4",t:"La carrera de precisión",e:2,x:"Cinta de llegada a 1,5 metros. Cada uno elige tiempo y velocidad: gana quien deje a Roli más cerca <b>sin pasarse</b>. Tres intentos.",c:["velocidad 150","adelante 2"]},
{id:"3.5",t:"¿Con zigzag o sin zigzag?",e:3,x:"Avancen 2 metros tres veces con zigzag y tres sin. ¿Cuál es más derecho? Si siempre se tuerce al mismo lado, corrijan con velocidad izq o der.",c:["zigzag 1","adelante 2","zigzag 0","adelante 2","velocidad izq 120","velocidad der 120"]}]},
{n:"Programas",i:"📝",k:"#1b9a55",w:[["programa","Empieza a grabar"],["fin","Termina de grabar (máximo 12 pasos)"],["listar","Muestra los pasos"],["ejecutar","Hace el programa"],["ejecutar 3","Lo repite 3 veces (hasta 9)"],["esperar 1","Pausa, solo dentro de un programa"],["borrar","Borra el programa"]],m:[
{id:"4.1",t:"Mi primer programa",e:1,x:"Los pasos no se ejecutan hasta escribir <b>ejecutar</b>. ¿Qué hizo <b>esperar</b>?",c:["programa","adelante 1","esperar 1","atras 1","fin","listar","ejecutar"]},
{id:"4.2",t:"El cuadrado automático",e:2,x:"El cuadrado de 3.3, pero grabado. Cambiá <b>0,5</b> por tu tiempo. ¿Termina donde empezó con 1 vuelta? ¿Y con 2?",c:["programa","adelante 2","derecha 0,5","adelante 2","derecha 0,5","adelante 2","derecha 0,5","adelante 2","derecha 0,5","fin","ejecutar","ejecutar 2"]},
{id:"4.3",t:"El baile de Roli",e:2,x:"Inventá tu propio baile (hasta 12 pasos) con di, led, esperar y movimientos. ¿Pueden hacerlo al ritmo de una canción?",c:["programa","di empieza el baile","led 1","derecha 0,5","izquierda 0,5","atras 0,5","adelante 0,5","led 0","di fin","fin","ejecutar 2"]},
{id:"4.4",t:"La espiral",e:3,x:"Cada lado más largo que el anterior. Ajustá los giros con tu tiempo del cuarto de vuelta.",c:["programa","adelante 0,5","derecha 0,5","adelante 1","derecha 0,5","adelante 1,5","derecha 0,5","adelante 2","derecha 0,5","fin","ejecutar"]},
{id:"4.5",t:"Detective de errores",e:2,x:"Uno graba un programa con un error escondido. El otro usa <b>listar</b>, encuentra el error y lo arregla. Después cambian de lugar.",c:["programa","listar","borrar"]}]},
{n:"Los ojos de Roli",i:"👀",k:"#c48a00",w:[["distancia","Mide al frente"],["distancia atras","Mide atrás"],["escanear","Mide a la izquierda, al frente y a la derecha"],["mirar izq","Gira el cuello (también der y frente)"],["mirar 45","Mira a 45 grados"],["proteccion 20","Frena a 20 cm (con 0 se apaga)"]],m:[
{id:"5.1",t:"¿Ve bien?",e:1,x:"Un adulto cerca en esta etapa. Poné la mano a 10, 20 y 30 cm (con regla) y escribí el comando cada vez. ¿Acierta? Probá con un peluche y con un libro.",c:["distancia"]},
{id:"5.2",t:"Detective de obstáculos",e:2,x:"Poné tres objetos: izquierda, frente y derecha. Antes de escanear, <b>adiviná</b> qué números va a decir.",c:["escanear","mirar izq","mirar der","mirar frente","mirar 45"]},
{id:"5.3",t:"Roli no choca",e:2,x:"Pared de libros a 1 metro. Roli frena solo y avisa a cuántos cm. Anotá dónde se detiene con cada distancia de freno. No uses <b>proteccion 0</b> sin un adulto al lado.",c:["proteccion 40","adelante 5","proteccion 20","adelante 5","proteccion 10","adelante 5"]},
{id:"5.4",t:"Mirar para atrás",e:2,x:"Poné la mano detrás de Roli y medí. Después retrocedé hacia una pared: ¿frena solo?",c:["distancia atras","atras 3"]},
{id:"5.5",t:"El estacionamiento",e:3,x:"Que Roli termine con la cola a unos 15 cm de la pared sin tocarla. ¿Pueden lograrlo tres veces seguidas?",c:["proteccion 15","atras 5"]}]},
{n:"Roli decide",i:"🧭",k:"#d02f84",w:[["girar der 90","Gira 90 grados a la derecha"],["girar izq 90","Gira 90 grados a la izquierda"],["explorar","Explora hasta decir parar"],["explorar 20","Explora 20 segundos"],["cuando obstaculo izquierda 1","Regla propia: qué hacer si ve algo"],["cuando obstaculo nada","Vuelve a decidir solo"]],m:[
{id:"6.1",t:"Girar con grados",e:2,x:"Mirá con una escuadra o con cinta si giró de más o de menos. Anotá el error de cada uno. 360 es una vuelta completa.",c:["girar der 90","girar izq 90","girar der 180","girar der 360"]},
{id:"6.2",t:"El cuadrado con grados",e:3,x:"El cuadrado grabado, pero con <b>girar der 90</b>. ¿Queda más prolijo que el de 4.2?",c:["programa","adelante 2","girar der 90","adelante 2","girar der 90","adelante 2","girar der 90","adelante 2","girar der 90","fin","ejecutar"]},
{id:"6.3",t:"Explorar",e:1,x:"Poné cajas en una pieza. Roli avanza, mira alrededor si algo queda cerca y se va por donde ve más lejos. <b>Adiviná</b> por dónde irá. Con parar lo detenés.",c:["explorar 20","parar"]},
{id:"6.4",t:"Reglas propias",e:3,x:"Enseñale qué hacer cuando ve un obstáculo y mirá cómo cambia. Probá otras reglas.",c:["cuando obstaculo izquierda 1","explorar 30","cuando obstaculo derecha 1","cuando obstaculo atras 1","cuando obstaculo nada"]},
{id:"6.5",t:"El laberinto",e:3,x:"Armá un laberinto con libros y cajas, con pasillos bien anchos. Resolvelo con un programa grabado a mano y con explorar. ¿Cuál tarda menos? ¿Cuál es más seguro?",c:["explorar","parar","programa"]}]}
];
const F=[];S.forEach((s,si)=>s.m.forEach(m=>F.push(Object.assign({si},m))));
let cur=0,P={};
try{P=JSON.parse(localStorage.getItem("roli_p")||"{}")}catch(e){}
const guardar=()=>{try{localStorage.setItem("roli_p",JSON.stringify(P))}catch(e){}};
const $=q=>document.querySelector(q);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cmd=(t,d)=>`<div class="cmd"><code>${esc(t)}</code>${d?`<small>${esc(d)}</small>`:""}<button class="cp" data-t="${esc(t)}">Copiar</button></div>`;

function renderM(){
  const m=F[cur],s=S[m.si],p=P[m.id]||{},el=$("#mision");
  el.style.setProperty("--k",s.k);
  el.innerHTML=`<span class="et">${s.i} Etapa ${m.si+1} · ${s.n}</span>
  <h2>Misión ${m.id} · ${m.t} <span class="st" title="Dificultad">${"★".repeat(m.e)}</span></h2>
  <p>${m.x}</p>${m.c.map(t=>cmd(t)).join("")}
  ${m.c[0]==="programa"?`<button class="sec" data-all>Copiar todas las líneas</button><p class="nota">Pegar varias líneas junto funciona; si algo falla, copiá de a una.</p>`:""}
  <div class="acc"><button class="hb ${p.h?"on":""}" data-a="h">${p.h?"✅ ¡Hecha!":"Marcar como hecha"}</button>
  <span>¿Te gustó?</span><button class="th ${p.g===1?"on":""}" data-a="up" aria-label="Me gustó">👍</button><button class="th ${p.g===-1?"on":""}" data-a="dn" aria-label="No me gustó">👎</button></div>
  <div class="nav"><button data-a="prev" ${cur?"":"disabled"}>← Anterior</button><span>${cur+1} de ${F.length}</span><button data-a="next" ${cur<F.length-1?"":"disabled"}>Siguiente →</button></div>`;
}
function renderI(){
  let h="";
  S.forEach((s,si)=>{
    h+=`<h3 style="--k:${s.k}">${s.i} ${si+1}. ${s.n}</h3>`;
    F.forEach((m,i)=>{if(m.si!==si)return;const p=P[m.id]||{};
      h+=`<button class="it ${i===cur?"cur":""}" style="--k:${s.k}" data-go="${i}"><span>${m.id} ${m.t}</span><span>${p.h?"✅":""}${p.g===1?"👍":p.g===-1?"👎":""}</span></button>`});
  });
  $("#idx").innerHTML=h;
  const n=F.filter(m=>(P[m.id]||{}).h).length;
  $("#prog").textContent=`${n} de ${F.length} misiones hechas`;
  $("#bar").style.width=(n/F.length*100)+"%";
}
function renderC(){
  $("#cmds").innerHTML=S.map((s,si)=>`<section style="--k:${s.k}"><h3>${s.i} Etapa ${si+1} · ${s.n}</h3>${s.w.map(w=>cmd(w[0],w[1])).join("")}</section>`).join("");
}
function todo(){renderM();renderI()}
function ir(i){cur=Math.max(0,Math.min(F.length-1,i));vista("m");todo();scrollTo(0,0)}
function vista(v){
  $("#mision").hidden=v!=="m";$("#cmds").hidden=v!=="c";
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
}
async function copiar(t,b){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch(e){
    const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();
    try{ok=document.execCommand("copy")}catch(e){}a.remove();
  }
  const o=b.textContent;b.textContent=ok?"¡Copiado!":"Copialo a mano";b.classList.add("hecho");
  setTimeout(()=>{b.textContent=o;b.classList.remove("hecho")},1200);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.t!==undefined)return copiar(b.dataset.t,b);
  if(b.hasAttribute("data-all"))return copiar(F[cur].c.join("\n"),b);
  if(b.dataset.go!==undefined)return ir(+b.dataset.go);
  if(b.dataset.v)return vista(b.dataset.v);
  const a=b.dataset.a;if(!a)return;
  const id=F[cur].id;P[id]=P[id]||{};
  if(a==="h")P[id].h=!P[id].h;
  else if(a==="up")P[id].g=P[id].g===1?0:1;
  else if(a==="dn")P[id].g=P[id].g===-1?0:-1;
  else if(a==="prev")return ir(cur-1);
  else if(a==="next")return ir(cur+1);
  else if(a==="reset"){if(confirm("¿Borrar todo lo que marcaron?")){P={};guardar();todo()}return}
  guardar();todo();
});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight")ir(cur+1);
  if(e.key==="ArrowLeft")ir(cur-1);
});
renderC();todo();
</script>
</body>
</html>
